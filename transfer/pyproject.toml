[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rtsconcepts"
version = "0.1.0"
description = "Game-independent RTS features, concepts and macro actions: learn in 0 A.D., transfer to OpenRA"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
rtsconcepts = "rtsconcepts.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["rtsconcepts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
